version: '3.8'

# GPU 版本：适合第 5-6 章开源模型实验（需要 NVIDIA GPU + nvidia-container-toolkit）
# 前置：nvidia-smi 确认驱动正常，nvidia-container-toolkit 已安装
# 启动：docker compose -f docker-compose.gpu.yml up jupyter-gpu

services:
  jupyter-gpu:
    image: pytorch/pytorch:2.4.0-cuda12.1-cudnn9-runtime
    container_name: sti-jupyter-gpu
    ports:
      - "8888:8888"
    volumes:
      - .:/workspace
      # 模型缓存目录挂载（避免重复下载）
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface
    env_file:
      - .env
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    working_dir: /workspace
    command: >
      bash -c "pip install jupyter jupyterlab -q &&
               pip install -e '.[ml,llm]' -q &&
               jupyter lab --ip=0.0.0.0 --port=8888
               --no-browser --allow-root
               --NotebookApp.token='' --NotebookApp.password=''"
    networks:
      - sti-network

networks:
  sti-network:
    driver: bridge
