version: '3.8'

services:
  jupyter:
    image: jupyter/datascience-notebook:latest
    container_name: signals-to-intelligence-jupyter
    ports:
      - "8888:8888"
    volumes:
      - .:/home/jovyan/work
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - GRANT_SUDO=yes
    command: start-notebook.sh --NotebookApp.token='' --NotebookApp.password=''
    networks:
      - signals-network

  # Optional: Redis for caching
  redis:
    image: redis:7-alpine
    container_name: signals-to-intelligence-redis
    ports:
      - "6379:6379"
    networks:
      - signals-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  signals-network:
    driver: bridge
